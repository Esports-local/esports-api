# 개발용 통합 실행: ui :8000 + api :8002 (기본 sqlite) + analyzer :8001 + MinIO (+ Postgres)
#   cp .env.example .env      # 컴퓨터마다 .env 만 다르게 둔다
#   docker compose up --build
# MinIO 는 .env 의 COMPOSE_PROFILES 에 minio, Postgres 는 postgres 가 있을 때만 띄운다.
# 다른 곳의 저장소를 쓰려면 COMPOSE_PROFILES 를 비우고 S3_* 를 그 주소로 바꾼다.
# 데이터는 named volume(pgdata, miniodata)에 유지된다. 지우려면 docker compose down -v
name: esports  # 네트워크 esports_default, 볼륨 esports_* (폴더 이름과 무관)
services:
  api:
    build: .
    env_file: .env
    ports:
      - "8002:8000"  # 호스트 8000 은 ui. 컨테이너끼리는 http://api:8000
    volumes:
      - .:/app  # 코드 수정 시 자동 reload
      - ${ANALYZER_OUTPUTS:-../esports-analyzer/outputs}:/outputs:ro  # import_outputs 가 읽는 analyzer 결과
    depends_on:
      db:
        condition: service_healthy
        required: false  # COMPOSE_PROFILES 에 postgres 가 없으면 띄우지 않음 (기본 sqlite)
      minio:
        condition: service_started
        required: false  # COMPOSE_PROFILES 에 minio 가 없으면 띄우지 않음
    # 저장소 준비(init_storage)가 실패해도 서버는 띄운다. 상태는 GET /health 가 503 으로 알려 준다
    command: >
      sh -c "python manage.py migrate &&
             { python manage.py init_storage || echo '[warn] 저장소 준비 실패. GET /health 확인'; } &&
             python manage.py runserver 0.0.0.0:8000"

  ui:
    # 화면 (esports-ui). 브라우저는 http://localhost:8000
    image: esports-ui
    build: ../esports-ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8000:8080"
    volumes:
      - ../esports-ui:/app  # 코드 수정 시 자동 reload
    depends_on:
      - api

  analyzer:
    # 분석 파이프라인 (esports-analyzer). 영상 목록 /videos, 분석 작업 /jobs, 번역 예상 /estimate
    image: esports-analyzer
    build: ../esports-analyzer
    env_file:
      - path: ../esports-analyzer/.env  # GEMINI_API_KEY (번역)
        required: false
    environment:
      VIDEOS_ROOT: /data
    ports:
      - "8001:8001"
    volumes:
      - ../esports-analyzer:/app  # 결과는 ../esports-analyzer/outputs 에 쌓이고 api 가 /outputs 로 읽는다
      - ${VIDEOS_DIR:-./videos}:/data:ro  # 분석할 원본 영상 폴더 (1920x1080 영상만 고를 수 있음)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  db:
    profiles: ["postgres"]
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vod}
      POSTGRES_DB: ${POSTGRES_DB:-vod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # 공식 minio/minio 이미지는 배포 중단 → MinIO 서버 재패키징 이미지(chainguard), digest 고정
    profiles: ["minio"]
    image: chainguard/minio@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"  # ui(hls.js)가 브라우저에서 직접 재생
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # 웹 콘솔
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
